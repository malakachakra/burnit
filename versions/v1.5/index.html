<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burn it</title>
<meta name="description" content="write it down, throw it in the fire, watch it go.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@0;1&family=Archivo+Narrow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="fog-far"></div>
  <div class="moon"></div>
  <div class="ground"></div>
  <canvas id="fire-back"></canvas>

  <!-- the figure, seen from behind. hidden while you write; walks in after you burn -->
  <svg id="figure" class="figure" viewBox="0 0 200 340" preserveAspectRatio="xMidYMax meet">
    <defs>
      <linearGradient id="shadow-fall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- the figure's shadow, thrown back toward the camera by the fire -->
    <g class="shadow">
      <path d="M56 334 L144 334 L198 470 L2 470 Z" fill="url(#shadow-fall)"/>
      <ellipse cx="100" cy="336" rx="56" ry="9" fill="#000" fill-opacity="0.5"/>
    </g>
    <g class="body">
      <g class="rim">
        <g class="arm-left"><path d="M50 144 C34 158 26 192 32 222 C36 238 56 238 60 222 C64 192 62 160 60 144 Z"/><circle cx="46" cy="230" r="12"/></g>
        <path class="leg-l" d="M60 240 C54 268 54 300 58 330 C66 339 90 339 97 330 C100 300 98 268 94 242 Z"/>
        <path class="leg-r" d="M106 242 C102 268 100 300 103 330 C110 339 134 339 142 330 C146 300 146 268 140 240 Z"/>
        <path class="torso" d="M62 130 C44 152 38 200 48 246 C62 268 138 268 152 246 C162 200 156 152 138 130 C128 116 72 116 62 130 Z"/>
        <g class="head"><ellipse cx="100" cy="78" rx="46" ry="50"/><ellipse cx="105" cy="31" rx="9" ry="7"/></g>
        <g class="arm-throw">
          <path d="M140 144 C138 160 136 192 140 222 C144 238 164 238 168 222 C174 192 168 158 152 144 Z"/>
          <circle cx="154" cy="230" r="12"/>
          <rect class="hand-paper" x="148" y="218" width="32" height="22" rx="1" transform="rotate(14 154 230)"/>
        </g>
      </g>
      <g class="dark">
        <g class="arm-left"><path d="M50 144 C34 158 26 192 32 222 C36 238 56 238 60 222 C64 192 62 160 60 144 Z"/><circle cx="46" cy="230" r="12"/></g>
        <path class="leg-l" d="M60 240 C54 268 54 300 58 330 C66 339 90 339 97 330 C100 300 98 268 94 242 Z"/>
        <path class="leg-r" d="M106 242 C102 268 100 300 103 330 C110 339 134 339 142 330 C146 300 146 268 140 240 Z"/>
        <path class="torso" d="M62 130 C44 152 38 200 48 246 C62 268 138 268 152 246 C162 200 156 152 138 130 C128 116 72 116 62 130 Z"/>
        <g class="head"><ellipse cx="100" cy="78" rx="46" ry="50"/><ellipse cx="105" cy="31" rx="9" ry="7"/></g>
        <g class="arm-throw">
          <path d="M140 144 C138 160 136 192 140 222 C144 238 164 238 168 222 C174 192 168 158 152 144 Z"/>
          <circle id="hand" cx="154" cy="230" r="12"/>
          <rect class="hand-paper" x="148" y="218" width="32" height="22" rx="1" transform="rotate(14 154 230)"/>
        </g>
      </g>
    </g>
  </svg>

  <canvas id="burn"></canvas>
  <canvas id="fire-front"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<!-- first person: your hands holding the sheet up to the fire -->
<div class="pov" id="pov">
  <svg class="hand hand-l" viewBox="0 0 200 330" aria-hidden="true">
    <path class="rim" d="M44 330 L112 330 C118 272 134 222 150 172 C166 122 162 74 130 66 C102 60 84 94 88 136 C74 188 52 258 44 330 Z"/>
    <path class="dark" d="M44 330 L112 330 C118 272 134 222 150 172 C166 122 162 74 130 66 C102 60 84 94 88 136 C74 188 52 258 44 330 Z"/>
  </svg>
  <svg class="hand hand-r" viewBox="0 0 200 330" aria-hidden="true">
    <path class="rim" d="M44 330 L112 330 C118 272 134 222 150 172 C166 122 162 74 130 66 C102 60 84 94 88 136 C74 188 52 258 44 330 Z"/>
    <path class="dark" d="M44 330 L112 330 C118 272 134 222 150 172 C166 122 162 74 130 66 C102 60 84 94 88 136 C74 188 52 258 44 330 Z"/>
  </svg>

  <form class="note" id="note" autocomplete="off">
    <label class="sr-only" for="msg">write it down</label>
    <div class="sheet">
      <textarea id="msg" maxlength="400" rows="7" placeholder="write it down." spellcheck="false"></textarea>
    </div>
    <svg class="thumb thumb-l" viewBox="0 0 70 90" aria-hidden="true">
      <path d="M10 88 C2 60 6 28 20 10 C28 0 42 2 46 14 C50 34 44 60 32 80 C26 90 14 92 10 88 Z"/>
    </svg>
    <svg class="thumb thumb-r" viewBox="0 0 70 90" aria-hidden="true">
      <path d="M10 88 C2 60 6 28 20 10 C28 0 42 2 46 14 C50 34 44 60 32 80 C26 90 14 92 10 88 Z"/>
    </svg>
    <div class="note-row">
      <button id="burn-btn" type="submit" disabled>burn it</button>
      <span class="count" id="count" aria-hidden="true"></span>
    </div>
  </form>
</div>

<div class="fade is-on" id="fade" aria-hidden="true"></div>

<button id="mute" class="mute" type="button" aria-pressed="false" aria-label="mute sound">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <path class="speaker" d="M4 9v6h4l5 4V5L8 9H4z"/>
    <path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke-width="1.6" stroke-linecap="round"/>
    <path class="cross" d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
</button>

<p id="sound-hint" class="hint">click anywhere for sound</p>

<script src="fire.js"></script>
<script src="burn.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
</body>
</html>
